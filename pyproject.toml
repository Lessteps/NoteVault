[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "automatizaci-n_de_proyectos_v1"
requires-python = ">=3.14"
description = "SDD Desktop Studio: Python 3.14 desktop + local-server application with PySide6 and Tornado"
version = "0.1.0"
license = "MIT"

dependencies = [
    "PySide6>=6.11,<7",
    "tornado>=6.4",
    "google-genai>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "watchdog>=5.0",
    "pywebview>=5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "PyInstaller>=6.10",
]

[tool.setuptools.packages.find]
include = ["sdd_app*", "sdd_studio*"]