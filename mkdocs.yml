site_name: NoteVault
site_description: "NoteVault documentation — local-first study, notes and personal management."
site_author: "Lessteps"
repo_url: https://github.com/Lessteps/NoteVault
repo_name: Lessteps/NoteVault
edit_uri: edit/main/docs_site/
docs_dir: docs_site
site_dir: site_build
use_directory_urls: false

theme:
  name: material
  custom_dir: overrides
  language: es
  palette:
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Cambiar a modo claro
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Cambiar a modo oscuro
  features:
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: es
          default: true
          name: Español
          build: true
        - locale: en
          name: English
          build: true
          nav_translations:
            Inicio: Home
            Empezar: Getting started
            Instalación: Installation
            Primeros pasos: First steps
            Guía de uso: User guide
            Módulos: Modules
            La bóveda: The vault
            Skills: Skills
            IA: AI
            Proyecto: Project
            Licencia y créditos: License and credits
            Contribuir: Contributing
            Hoja de ruta: Roadmap
            Apoyar el proyecto: Support the project
            Ingeniería: Engineering
            Portal de arquitectura: Architecture portal

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true

extra_css:
  - stylesheets/custom.css

nav:
  - Inicio: index.md
  - Empezar:
      - Instalación: empezar/instalacion.md
      - Primeros pasos: empezar/primeros-pasos.md
  - Guía de uso:
      - Módulos: guia/modulos.md
      - La bóveda: guia/boveda.md
      - Mentor: guia/mentor.md
      - Skills: guia/skills.md
      - IA: guia/ia.md
  - Proyecto:
      - Licencia y créditos: proyecto/licencia.md
      - Contribuir: proyecto/contribuir.md
      - Hoja de ruta: proyecto/hoja-de-ruta.md
